apiVersion: apps/v1
kind: Deployment
metadata:
  name: soul-deployment
  labels:
    app: soul
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soul
  template:
    metadata:
      labels:
        app: soul
    spec:
      containers:
      - name: soul-app
        image: johnbiikibet/soul:latest
        ports:
        - containerPort: 8501
        env:
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: soul-secrets
              key: supabase-url
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: soul-secrets
              key: supabase-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: soul-secrets
              key: openai-api-key
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "500m"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: soul-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8501
  selector:
    app: soul
