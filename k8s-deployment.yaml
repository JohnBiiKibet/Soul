apiVersion: apps/v1
kind: Deployment
metadata:
  name: soul-deployment
  labels:
    app: soul
spec:
  replicas: 2  # Maintains continuous high-availability nodes across your workspace
  selector:
    matchLabels:
      app: soul
  template:
    metadata:
      labels:
        app: soul
    spec:
      containers:
      - name: soul-app
        image: your-dockerhub-username/soul:latest  # Replace with your compiled image tag registry
        ports:
        - containerPort: 8501
        # Maps backend connection credentials securely from a Kubernetes Secret cluster object
        env:
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: soul-secrets
              key: supabase-url
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: soul-secrets
              key: supabase-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: soul-secrets
              key: openai-api-key
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "500m"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: soul-service
spec:
  type: LoadBalancer  # Spins up an automatic public routing URL on cloud providers
  ports:
  - port: 80
    targetPort: 8501
  selector:
    app: soul
